name: Deploy QA Dojo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static assets
        run: |
          for asset in index.html app.js styles.css favicon.svg favicon-32x32.png apple-touch-icon.png; do
            test -s "$asset" || { echo "Missing or empty: $asset"; exit 1; }
          done
          test "$(file -b --mime-type favicon-32x32.png)" = "image/png"
          test "$(file -b --mime-type apple-touch-icon.png)" = "image/png"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear stuck deployment for timed-out commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stuck_sha=3cc983108a055253d565bf85816771bd6a0b2571
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${stuck_sha}/cancel"
          deployment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?per_page=100" \
            --jq ".[] | select(.sha == \"${stuck_sha}\") | .id")
          if [ -n "$deployment_ids" ]; then
            while IFS= read -r deployment_id; do
              echo "Clearing stale deployment ID $deployment_id (commit $stuck_sha)"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -f state=inactive -f description="Clearing timed-out GitHub Pages deployment"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
            done <<< "$deployment_ids"
          else
            echo "No matching legacy deployment record; cancellation requested for Pages deployment $stuck_sha"
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
