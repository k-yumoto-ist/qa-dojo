name: Deploy QA Dojo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static assets
        run: |
          for asset in index.html app.js styles.css favicon.svg favicon-32x32.png apple-touch-icon.png; do
            test -s "$asset" || { echo "Missing or empty: $asset"; exit 1; }
          done
          test "$(file -b --mime-type favicon-32x32.png)" = "image/png"
          test "$(file -b --mime-type apple-touch-icon.png)" = "image/png"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
