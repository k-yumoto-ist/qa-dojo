<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b31">
  <meta name="description" content="QA道場 — 仕様を読み、テストを設計し、実際に操作して不具合を見つける実践型QAトレーニング。">
  <meta name="apple-mobile-web-app-title" content="QA道場">
  <title>QA道場 | 仕様から、品質を見抜く。</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="メインナビゲーション">
      <a class="brand" href="./" data-nav="dashboard" aria-label="QA道場 ホーム">
        <span class="brand-mark">Q<span>✦</span></span><span class="brand-name">QA<span>道場</span><small>QUALITY ENGINEERING DOJO</small></span>
      </a>
      <div class="sidebar-caption">WORKSPACE</div>
      <nav class="sidebar-nav" aria-label="メニュー">
        <button type="button" class="nav-link active" data-nav="dashboard"><span class="nav-icon">⌂</span> ダッシュボード</button>
        <button type="button" class="nav-link" data-nav="dojo"><span class="nav-icon">◇</span> 修行を始める <span class="nav-dot"></span></button>
        <button type="button" class="nav-link" data-nav="records"><span class="nav-icon">▤</span> 修行の記録</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-quote"><span>“</span>品質は、テストの数ではなく、<br>問いの深さから生まれる。</div>
        <div class="profile-mini"><span class="profile-avatar">QA</span><span><strong>QA Trainee</strong><small>LOCAL TRAINING MODE</small></span><span class="profile-online"></span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-crumb">LEARNING SPACE <span>/</span> <strong id="breadcrumb">ダッシュボード</strong></div>
        <div class="topbar-right"><span class="local-label"><span class="status-pulse"></span> LOCAL SAVE</span><span class="top-avatar">Q</span></div>
      </header>
      <main id="main" class="main-content" tabindex="-1"><noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript></main>
      <footer class="footer"><span>QA DOJO — LEARN BY DOING</span><span>v1.0 · Frontend only</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./scenarios.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
